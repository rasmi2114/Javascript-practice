<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jokes! App </title>
    <style>
        .main_section{
            display: flex;
             margin-top: 1rem;  
        }
        .image1{
            width: 60%;
        }
        .api_body{
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Welcome to Dad Jokes!</h1>
      <section class="api_body"></section>
      <button id="fetchJoke">Get Another Joke</button>
    </div>
    <div class ="main_section">
        <img class ="image1" src="./../../images/promises.png">
     </div>
    <script>
    const apiBody = document.querySelector(".api_body");

    const apiUrl = "https://icanhazdadjoke.com/";

    const fetchData = () => {

        fetch(apiUrl, {
            headers: {
                Accept: "application/json"
            }
        })
        .then((res) => {
            console.log(res);

            if (!res.ok) {
                throw new Error(`HTTP Error: ${res.status}`);
            }

            return res.json();
        })
        .then((data) => {
            console.log(data);

            // Show joke in console
            console.log(data.joke);

            // Show joke on webpage
            apiBody.textContent = data.joke;
        })
        .catch((error) => {
            apiBody.innerHTML = `Api is not working properly.`;
            console.log(error);
        });
    };

    document.getElementById("fetchJoke").addEventListener("click", fetchData);

</script>
  </body>
</html>
